# Provisions the Bunny hosting and rolls out the edge script, on every push to
# main and on demand. Idempotent: an unchanged account stays unchanged.
#
# Deployment credentials are SOPS-encrypted in .limen/production and unlocked
# through Limen's GitHub OIDC policy for main / production / this workflow.
# LIMEN_INSTALL_TOKEN only downloads the private Limen action and CLI.
name: Deploy to Bunny

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # A public repository cannot directly use an action in a private repo.
      - name: Check out pinned Limen decrypt action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sebastian-software/limen
          ref: d205ac6e27f317e8b9f3c0072d85b61879574950 # decrypt-action-v0.10.0
          token: ${{ secrets.LIMEN_INSTALL_TOKEN }}
          path: .deployment-tools/limen
          sparse-checkout: actions/decrypt
          persist-credentials: false

      - name: Decrypt production credentials
        uses: ./.deployment-tools/limen/actions/decrypt
        with:
          environment: production
          install-token: ${{ secrets.LIMEN_INSTALL_TOKEN }}
          limen-version: limen-cli-v0.10.0

      - name: Load and mask deployment credentials
        run: node scripts/deployment-env.ts

      - name: Provision script, pull zone, caching, hostname
        id: provision
        run: node scripts/provision.ts

      - name: Publish the bundled script and purge the cache
        env:
          SCRIPT_ID: ${{ steps.provision.outputs.script_id }}
          PULL_ZONE_ID: ${{ steps.provision.outputs.pull_zone_id }}
        run: node scripts/publish.ts dist/script.js

      - name: Smoke check
        run: >-
          node scripts/verify.ts
          "https://${{ steps.provision.outputs.pull_zone_host }}"
          ${{ steps.provision.outputs.custom_host_ready == 'true' && 'https://metrics.sebastian-software.com' || '' }}

      - name: Summary
        if: always() && steps.provision.outputs.script_id != ''
        run: |
          {
            echo "### oss-metrics rollout"
            echo "- Pull zone host (CNAME target): \`${{ steps.provision.outputs.pull_zone_host }}\`"
            echo "- Custom hostname ready: \`${{ steps.provision.outputs.custom_host_ready }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decrypted credentials
        if: always()
        run: rm -f -- .env.production.local
