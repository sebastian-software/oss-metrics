# Provisions the Bunny hosting and rolls out the edge script, on every push to
# main and on demand. Idempotent: an unchanged account stays unchanged.
#
# Needs, in the protected Environment "production":
#   BUNNY_API_KEY         Bunny account API key
#   METRICS_GITHUB_TOKEN  fine-grained token, public read only (GitHub rate limit)
# Until BUNNY_API_KEY exists the rollout is skipped, so pushes stay green.
name: Deploy to Bunny

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    environment: production
    env:
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      METRICS_GITHUB_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Skip until Bunny is configured
        if: env.BUNNY_API_KEY == ''
        run: echo "::notice::BUNNY_API_KEY is not set in the production environment; skipping the rollout."

      - name: Provision script, pull zone, caching, hostname
        id: provision
        if: env.BUNNY_API_KEY != ''
        run: node scripts/provision.ts

      - name: Publish the bundled script and purge the cache
        if: env.BUNNY_API_KEY != ''
        env:
          SCRIPT_ID: ${{ steps.provision.outputs.script_id }}
          PULL_ZONE_ID: ${{ steps.provision.outputs.pull_zone_id }}
        run: node scripts/publish.ts dist/script.js

      - name: Smoke check
        if: env.BUNNY_API_KEY != ''
        run: >-
          node scripts/verify.ts
          "https://${{ steps.provision.outputs.pull_zone_host }}"
          ${{ steps.provision.outputs.custom_host_ready == 'true' && 'https://metrics.sebastian-software.com' || '' }}

      - name: Summary
        if: always() && env.BUNNY_API_KEY != ''
        run: |
          {
            echo "### oss-metrics rollout"
            echo "- Pull zone host (CNAME target): \`${{ steps.provision.outputs.pull_zone_host }}\`"
            echo "- Custom hostname ready: \`${{ steps.provision.outputs.custom_host_ready }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
