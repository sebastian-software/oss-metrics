# Provisions Bunny and rolls out the edge script on API changes to main and on
# demand. The dashboard has its own Pages workflow. Unchanged hosting stays unchanged.
#
# BUNNY_API_KEY comes from the shared GitHub organization Actions secret.
# No private action, install token or local plaintext credential file is needed.
name: Deploy to Bunny

on:
  push:
    branches: [main]
    # Website-only changes publish to Pages without rolling out the API.
    paths:
      - 'src/**'
      - 'types/**'
      - 'scripts/build.ts'
      - 'scripts/bunny.ts'
      - 'scripts/provision.ts'
      - 'scripts/publish.ts'
      - 'scripts/verify.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Provision script, pull zone, caching, hostname
        id: provision
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          METRICS_GITHUB_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN }}
          METRICS_RYBBIT_CONFIG: ${{ secrets.METRICS_RYBBIT_CONFIG }}
          METRICS_RYBBIT_API_KEY: ${{ secrets.METRICS_RYBBIT_API_KEY }}
        run: node scripts/provision.ts

      - name: Publish the bundled script and purge the cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          SCRIPT_ID: ${{ steps.provision.outputs.script_id }}
          PULL_ZONE_ID: ${{ steps.provision.outputs.pull_zone_id }}
        run: node scripts/publish.ts dist/script.js

      - name: Smoke check
        run: >-
          node scripts/verify.ts
          "https://${{ steps.provision.outputs.pull_zone_host }}"
          ${{ steps.provision.outputs.custom_host_ready == 'true' && 'https://metrics.sebastian-software.com' || '' }}

      - name: Summary
        if: always() && steps.provision.outputs.script_id != ''
        run: |
          {
            echo "### oss-metrics rollout"
            echo "- Pull zone host (CNAME target): \`${{ steps.provision.outputs.pull_zone_host }}\`"
            echo "- Custom hostname ready: \`${{ steps.provision.outputs.custom_host_ready }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
